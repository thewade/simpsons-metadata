name: Validate metadata
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and validate public data
        run: python3 scripts/build.py
      - name: Verify generated API files
        run: |
          test -s dist/v1/episodes.json
          test -s dist/v1/manifest.json
          test -s dist/v1/movies.json
          test -s dist/openapi.json
          test -s dist/index.html
